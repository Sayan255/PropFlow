name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests (shared + web)
        run: npm run test:unit

      - name: Web production build
        run: npm run build -w apps/web

  integration:
    name: Integration tests (MySQL + Redis)
    runs-on: ubuntu-latest
    needs: static-checks

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-dev-password
          MYSQL_DATABASE: auth_db
          MYSQL_USER: propflow
          MYSQL_PASSWORD: propflow-dev-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-dev-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: propflow
      MYSQL_PASSWORD: propflow-dev-password
      MYSQL_AUTH_DATABASE: auth_db
      MYSQL_CRM_DATABASE: crm_db
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
      SEED_PASSWORD: Password123!
      JWT_ACCESS_TTL: 60s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate RS256 dev keys
        run: npm run keys:generate -w auth-server

      - name: Auth-server integration tests
        run: npm run test:integration -w auth-server

      - name: crm-api integration tests
        run: npm run test:integration -w crm-api
