worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Upstreams. `server crm-api:4002` resolves via Docker's embedded DNS and
    # round-robins across every replica, so `docker compose up --scale crm-api=2`
    # works with zero config changes.
    # ---------------------------------------------------------------------------
    upstream auth_upstream { server auth:4001; }
    upstream crm_upstream  { server crm-api:4002; }

    # Rate-limit login attempts at the edge as well (defense in depth on top of
    # the Redis-backed limiter inside auth-server).
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;

        # ── Static SPA ────────────────────────────────────────────────────────
        location / {
            proxy_pass http://web:80;
        }

        # ── Auth API (cookie is scoped to /auth, so the prefix is preserved) ──
        location /auth/ {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /auth-api/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://auth_upstream/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Vite dev-proxy parity: /auth-api/* → /* (strip prefix; cookie path unaffected)
        location /auth-api/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /.well-known/jwks.json {
            proxy_pass http://auth_upstream/.well-known/jwks.json;
        }

        # ── CRM API ───────────────────────────────────────────────────────────
        # Vite dev-proxy parity: /crm-api/* → /* (strip prefix)
        location /crm-api/ {
            proxy_pass http://crm_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO websocket upgrade ───────────────────────────────────────
        location /crm-api/socket.io/ {
            proxy_pass http://crm_upstream/socket.io/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
