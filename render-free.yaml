# PropFlow on Render — always-on application services with TiDB external
#
# Same architecture as render.yaml (edge nginx serves SPA + proxies /auth-api
# and /crm-api, so the browser uses ONE origin — no VITE_API_ORIGIN needed),
# but MySQL and Redis move to free external providers:
#
#   MySQL  → TiDB Cloud Serverless (free, MySQL wire-compatible, TLS, no card)
#   Redis  → Render Key Value 256MB plan with persistence
#   auth/crm/edge → Render Starter web services (always on)
#
# NOTE: Render's free plan no longer offers `pserv` (private services) —
# "service type is not available for this plan" — so auth/crm/web run as
# regular (public-URL) web services. Their routes are JWT-protected and CORS
# only allows your edge origin, so the public URLs are inert for browsers and
# useless without a valid token. Don't share them; share only the edge URL.
#
# This blueprint keeps the existing service names and TiDB database settings,
# but uses paid always-on app plans. Syncing these plan changes in Render will
# incur Render charges. A Free plan cannot provide reliable always-on login.
#
# TiDB prep (before deploying): one TiDB Serverless cluster; in its SQL console:
#   CREATE DATABASE IF NOT EXISTS auth_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   CREATE DATABASE IF NOT EXISTS crm_db  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Then note host (<cluster>.tidbcloud.com, port 4000), username (<user>.<suffix>.root)
# and the app password. Set TLS via MYSQL_SSL=true (handled below).

previews:
  generation: off

services:
  # ── Redis-compatible cache (paid 256MB, persistent) ───────────────────────
  - type: keyvalue
    name: propflow-free-redis
    plan: 256mb
    ipAllowList: []            # private-network access from auth/crm only
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  # ── auth-server (always-on web service; JWT-protected routes only) ────────
  - type: web
    name: propflow-free-auth
    runtime: docker
    dockerfilePath: docker/Dockerfile.auth
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /health   # Render restarts the container when this fails
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # ── TiDB (external MySQL) ──────────────────────────────────────────────
      - key: MYSQL_HOST
        sync: false            # e.g. abc123def.cluster-abcxyz.ap-southeast-1.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false            # e.g. 4AbCdEfGh.root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_AUTH_DATABASE
        value: auth_db
      - key: MYSQL_SSL
        value: "true"          # TiDB terminates TLS
      # ── Redis (Render Key Value) ──────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: propflow-free-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_TLS
        value: "false"         # private-network Redis; no TLS in front
      # ── HTTP ───────────────────────────────────────────────────────────────
      - key: AUTH_PORT
        value: "4001"
      - key: JWT_ACCESS_TTL
        value: 60s
      - key: INVITE_TTL_HOURS
        value: "24"
      - key: COOKIE_SECURE
        value: "true"          # edge terminates TLS
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: CORS_ORIGIN
        value: https://propflow-sayan.onrender.com
      - key: FRONTEND_URL
        value: https://propflow-sayan.onrender.com
      - key: SEED_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false            # flattened PEM (docs/DEPLOY-FREE.md step 2)
      - key: JWT_PUBLIC_KEY
        sync: false

  # ── crm-api (always-on web service; JWT-protected routes only) ────────────
  - type: web
    name: propflow-free-crm
    runtime: docker
    dockerfilePath: docker/Dockerfile.crm
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /health   # Render restarts the container when this fails
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # ── TiDB ───────────────────────────────────────────────────────────────
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_CRM_DATABASE
        value: crm_db
      - key: MYSQL_SSL
        value: "true"
      # ── Redis ──────────────────────────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: propflow-free-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_TLS
        value: "false"
      # ── HTTP + auth dependency ─────────────────────────────────────────────
      - key: CRM_PORT
        value: "4002"
      # Free plan has no private DNS: reach auth over its public HTTPS URL.
      - key: AUTH_JWKS_URL
        value: https://propflow-free-auth.onrender.com/.well-known/jwks.json
      - key: CORS_ORIGIN
        value: https://propflow-sayan.onrender.com
      - key: EXPORT_MAX_ROWS
        value: "50000"   # H11: full 10k export must succeed
      - key: ENABLE_CRON
        value: "true"          # harmless if asleep; single replica owns the lock
      - key: SEED_PROPERTIES_PER_TENANT
        value: "200"           # keep first boot fast on TiDB

  # ── The only public entrypoint: edge nginx (SPA + API proxying) ───────────
  # The SPA is baked into this image (see Dockerfile.edge-free), so there is
  # no separate web service. The nginx template reaches auth/crm over their
  # public HTTPS URLs — free plan has no private DNS (hosts are hardcoded in
  # docker/edge-free.conf.template).
  - type: web
    name: propflow-sayan
    runtime: docker
    dockerfilePath: docker/Dockerfile.edge-free
    dockerContext: .
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: LOGIN_RATE_LIMIT
        value: 30r/m
